<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ave Mujica - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', 'Times New Roman', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e0e0e0;
        }

        /* 帷幕幕布 */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 9999;
            display: flex;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 1.8s;
        }

        .curtain {
            width: 50vw;
            height: 100dvh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
            display: flex;
            align-items: center;
        }

        .curtain-left { border-right: 2px solid #ba55d3; justify-content: flex-end; }
        .curtain-right { border-left: 2px solid #ba55d3; justify-content: flex-start; }

        .curtain-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #f5f5f5; font-size: 1.2rem; letter-spacing: 2px;
            text-shadow: 0 0 15px #ba55d3, 0 0 25px #8b0000;
            border: 1px solid rgba(186, 85, 211, 0.5);
            padding: 14px 24px; background: rgba(10, 0, 15, 0.85);
            border-radius: 6px; z-index: 10000; pointer-events: none;
            transition: opacity 0.5s; white-space: nowrap;
        }

        .curtain-container.open .curtain-left { transform: translateX(-100%); }
        .curtain-container.open .curtain-right { transform: translateX(100%); }
        .curtain-container.open .curtain-text { opacity: 0; }
        .curtain-container.open { pointer-events: none; }

        /* 版面結構 */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
            background: #000;
        }

        .header-bar {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 8px 10px;
            background: linear-gradient(to bottom, rgba(10, 0, 15, 0.9) 0%, transparent 100%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        h1 { font-size: 0.9rem; letter-spacing: 2px; color: #f5f5f5; text-shadow: 0 0 10px rgba(186, 85, 211, 0.8); }
        .subtitle { font-size: 0.65rem; color: #ba55d3; letter-spacing: 1px; font-weight: 300; }

        .video-section {
            flex: 1;
            width: 100vw;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 改用原生 video 元素 */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-section {
            height: 60px;
            width: 100vw;
            background: #0a000f;
            border-top: 1px solid rgba(186, 85, 211, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 16px; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px;
            color: #ffffff; background: rgba(74, 0, 114, 0.8);
            border: 1px solid rgba(186, 85, 211, 0.6); border-radius: 20px;
            text-decoration: none; transition: all 0.3s ease; cursor: pointer;
        }

        .btn:active, .btn:hover {
            background: rgba(139, 0, 0, 0.9); box-shadow: 0 0 15px rgba(186, 85, 211, 0.8);
        }
    </style>
</head>
<body>

    <!-- 帷幕幕布 -->
    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">歡迎來到 Ave Mujica 的世界</div>
    </div>

    <div class="layout-wrapper">
        <div class="header-bar">
            <h1>Ave Mujica</h1>
            <p class="subtitle">Ave Mujica「顔」「Sophie」「‘S_’ The Way」「KiLLKiSS」</p>
        </div>

        <div class="video-section">
            <!-- 原生 HTML5 Video 支援 iOS 全螢幕呼叫 -->
            <video id="myVideo" controls playsinline preload="auto">
                <source src="YOUR_DIRECT_VIDEO_URL.mp4" type="video/mp4">
            </video>
        </div>

        <div class="control-section">
            <button class="btn" onclick="triggerNativeFullscreen()">⤢ 手機原生全螢幕</button>
            <a href="https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/view" 
               target="_blank" class="btn">
               開啟原始雲端
            </a>
        </div>
    </div>

    <script>
        function startExperience() {
            document.getElementById('curtainContainer').classList.add('open');
            const video = document.getElementById('myVideo');
            video.play();
        }

        function triggerNativeFullscreen() {
            const video = document.getElementById('myVideo');
            
            /* 針對 iPhone / iOS Safari 的專屬原生全螢幕 API */
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            } else if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        }
    </script>

</body>
</html>
