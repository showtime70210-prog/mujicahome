<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ave Mujica - Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #000; font-family: sans-serif; color: #e0e0e0; }

        .curtain-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 9999;
            display: flex; cursor: pointer; transition: opacity 0.5s, visibility 1.8s;
        }
        .curtain {
            width: 50vw; height: 100dvh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-left { border-right: 2px solid #ba55d3; }
        .curtain-right { border-left: 2px solid #ba55d3; }
        .curtain-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; padding: 14px 24px; background: rgba(10, 0, 15, 0.85);
            border: 1px solid #ba55d3; border-radius: 6px; white-space: nowrap;
        }
        .curtain-container.open .curtain-left { transform: translateX(-100%); }
        .curtain-container.open .curtain-right { transform: translateX(100%); }
        .curtain-container.open .curtain-text { opacity: 0; }
        .curtain-container.open { pointer-events: none; }

        .layout-wrapper { display: flex; flex-direction: column; width: 100vw; height: 100dvh; }
        .header-bar { padding: 10px; text-align: center; background: #0a000f; border-bottom: 1px solid #ba55d3; }
        h1 { font-size: 1rem; color: #fff; }
        .subtitle { font-size: 0.7rem; color: #ba55d3; }

        .video-section { flex: 1; width: 100vw; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .control-section {
            height: 70px; background: #0a000f; border-top: 1px solid #ba55d3;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .btn {
            padding: 10px 20px; font-size: 0.85rem; font-weight: bold; color: #fff;
            background: rgba(74, 0, 114, 0.9); border: 1px solid #ba55d3;
            border-radius: 20px; text-decoration: none; display: inline-block;
        }
    </style>
</head>
<body>

    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">歡迎來到 Ave Mujica 的世界</div>
    </div>

    <div class="layout-wrapper">
        <div class="header-bar">
            <h1>Ave Mujica</h1>
            <p class="subtitle">Ave Mujica「顔」「Sophie」「‘S_’ The Way」「KiLLKiSS」</p>
        </div>

        <div class="video-section">
            <iframe id="videoIframe" src="" allow="autoplay; fullscreen"></iframe>
        </div>

        <div class="control-section">
            <!-- 直接導向原生頁面，iPhone 點擊後會直接跳出 iOS 原生全螢幕播放器 -->
            <a href="https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/view" 
               target="_blank" class="btn">
               ⤢ 手機全螢幕播放
            </a>
        </div>
    </div>

    <script>
        function startExperience() {
            document.getElementById('curtainContainer').classList.add('open');
            document.getElementById('videoIframe').src = "https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/preview?autoplay=1";
        }
    </script>
</body>
</html>
