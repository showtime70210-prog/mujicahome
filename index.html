<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ave Mujica - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', 'Times New Roman', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e0e0e0;
        }

        /* 全螢幕帷幕容器 */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 9999;
            display: flex;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 1.8s;
        }

        .curtain {
            width: 50vw;
            height: 100dvh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
            display: flex;
            align-items: center;
        }

        .curtain-left {
            border-right: 2px solid #ba55d3;
            justify-content: flex-end;
        }

        .curtain-right {
            border-left: 2px solid #ba55d3;
            justify-content: flex-start;
        }

        .curtain-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5f5f5;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ba55d3, 0 0 25px #8b0000;
            border: 1px solid rgba(186, 85, 211, 0.5);
            padding: 14px 24px;
            background: rgba(10, 0, 15, 0.85);
            border-radius: 6px;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.5s;
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
        }

        .curtain-container.open .curtain-left {
            transform: translateX(-100%);
        }

        .curtain-container.open .curtain-right {
            transform: translateX(100%);
        }

        .curtain-container.open .curtain-text {
            opacity: 0;
        }

        .curtain-container.open {
            pointer-events: none;
        }

        /* 頂部懸浮標題 (點擊穿透) */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, rgba(10, 0, 15, 0.85) 0%, transparent 100%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #f5f5f5;
            text-shadow: 0 0 10px rgba(186, 85, 211, 0.8);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #ba55d3;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* 主容器：居中呈現，防止行動版播放器選單被垂直拉撐出外圍 */
        .main-wrapper {
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            background: #000;
            padding: 45px 0 calc(20px + env(safe-area-inset-bottom));
        }

        /* 影片視窗：精準鎖定最大高度與寬度比例 */
        .video-viewport {
            width: 100vw;
            height: 100%;
            max-height: calc(100dvh - 70px - env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右上角懸浮按鈕 */
        .footer-bar {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 10;
        }

        .btn {
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            background: rgba(74, 0, 114, 0.75);
            border: 1px solid rgba(186, 85, 211, 0.5);
            border-radius: 20px;
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(139, 0, 0, 0.85);
            box-shadow: 0 0 15px rgba(186, 85, 211, 0.8);
        }
    </style>
</head>
<body>

    <!-- 帷幕幕布 -->
    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">歡迎來到 Ave Mujica 的世界</div>
    </div>

    <div class="header-bar">
        <h1>Ave Mujica</h1>
        <p class="subtitle">Ave Mujica「顔」「Sophie」「‘S_’ The Way」「KiLLKiSS」</p>
    </div>

    <div class="footer-bar">
        <a href="https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/view" 
           target="_blank" 
           class="btn">
            開啟原始雲端
        </a>
    </div>

    <!-- 影片主要容器 -->
    <div class="main-wrapper">
        <div class="video-viewport">
            <iframe 
                id="videoIframe"
                src="" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        function startExperience() {
            // 1. 拉開帷幕
            document.getElementById('curtainContainer').classList.add('open');
            
            // 2. 載入 Google Drive 影片播放器
            const iframe = document.getElementById('videoIframe');
            iframe.src = "https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/preview?autoplay=1";
        }
    </script>

</body>
</html>
