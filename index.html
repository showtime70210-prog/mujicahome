<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ave Mujica - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', 'Times New Roman', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f linear-gradient(135deg, #0d0614 0%, #050508 50%, #150811 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        /* 全螢幕帷幕容器 */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            cursor: pointer;
            transition: visibility 1.8s;
        }

        .curtain {
            width: 50vw;
            height: 100vh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
            display: flex;
            align-items: center;
        }

        .curtain-left {
            border-right: 2px solid #ba55d3;
            justify-content: flex-end;
        }

        .curtain-right {
            border-left: 2px solid #ba55d3;
            justify-content: flex-start;
        }

        /* 帷幕中央提示文字 */
        .curtain-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5f5f5;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #ba55d3, 0 0 25px #8b0000;
            border: 1px solid rgba(186, 85, 211, 0.5);
            padding: 18px 36px;
            background: rgba(10, 0, 15, 0.85);
            border-radius: 6px;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* 點擊拉開動畫 */
        .curtain-container.open .curtain-left {
            transform: translateX(-100%);
        }

        .curtain-container.open .curtain-right {
            transform: translateX(100%);
        }

        .curtain-container.open .curtain-text {
            opacity: 0;
        }

        .curtain-container.open {
            pointer-events: none;
        }

        /* 主網頁內容 (放寬放大) */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(18, 16, 26, 0.85);
            backdrop-filter: blur(12px);
            width: 95vw;
            max-width: 1600px;
            height: 92vh;
            padding: 20px 25px;
            border-radius: 16px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(138, 43, 226, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-section {
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #f5f5f5;
            text-shadow: 0 0 10px rgba(186, 85, 211, 0.6), 0 0 20px rgba(139, 0, 0, 0.5);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #ba55d3;
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        /* 影片容器：佔滿剩餘大部分高度 */
        .iframe-container {
            position: relative;
            width: 100%;
            flex: 1;
            margin: 10px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(186, 85, 211, 0.4);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 8px 25px rgba(0, 0, 0, 0.6);
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 10px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(135deg, #4a0072 0%, #8b0000 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(74, 0, 114, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #6a009c 0%, #b22222 100%);
            box-shadow: 0 0 20px rgba(186, 85, 211, 0.6);
            transform: translateY(-2px);
        }

        footer {
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- 帷幕結構 -->
    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">點擊揭幕 / CLICK TO ENTER</div>
    </div>

    <!-- 主頁面 -->
    <div class="container">
        <div class="header-section">
            <h1>Ave Mujica</h1>
            <p class="subtitle">Ave Mujica「顔」「Sophie」「‘S_’ The Way」「KiLLKiSS」</p>
        </div>

        <div class="iframe-container">
            <iframe 
                id="videoIframe"
                src="" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer-section">
            <a href="https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/view" 
               target="_blank" 
               class="btn">
                開啟 / 下載原始檔案
            </a>
            <footer>
                <p>&copy; mujicahome | All Rights Reserved</p>
            </footer>
        </div>
    </div>

    <script>
        function startExperience() {
            // 1. 觸發拉開帷幕動畫
            document.getElementById('curtainContainer').classList.add('open');
            
            // 2. 載入並播放影片
            const iframe = document.getElementById('videoIframe');
            iframe.src = "https://drive.google.com/file/d/1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA/preview?autoplay=1";
        }
    </script>

</body>
</html>
