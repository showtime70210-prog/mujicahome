<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ave Mujica - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', -apple-system, sans-serif;
            color: #e0e0e0;
        }

        /* 帷幕幕布 */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 9999;
            display: flex;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 1.8s;
        }

        .curtain {
            width: 50vw;
            height: 100dvh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
            display: flex;
            align-items: center;
        }

        .curtain-left { border-right: 2px solid #ba55d3; justify-content: flex-end; }
        .curtain-right { border-left: 2px solid #ba55d3; justify-content: flex-start; }

        .curtain-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5f5f5;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ba55d3, 0 0 25px #8b0000;
            border: 1px solid rgba(186, 85, 211, 0.5);
            padding: 14px 24px;
            background: rgba(10, 0, 15, 0.85);
            border-radius: 6px;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.5s;
            white-space: nowrap;
        }

        .curtain-container.open .curtain-left { transform: translateX(-100%); }
        .curtain-container.open .curtain-right { transform: translateX(100%); }
        .curtain-container.open .curtain-text { opacity: 0; }
        .curtain-container.open { pointer-events: none; }

        /* 滿版影片區域 */
        .video-container {
            width: 100vw;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 音效元件 (防快取 + iOS 相容) -->
    <audio id="openSound" preload="auto" playsinline>
        <source src="music.mp3?v=3.0" type="audio/mpeg">
    </audio>

    <!-- 帷幕幕布 -->
    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">歡迎來到 Ave Mujica 的世界</div>
    </div>

    <!-- 新的 Google Drive 雲端影片區 -->
    <div class="video-container">
        <iframe 
            id="videoIframe"
            src="" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function startExperience() {
            // 1. 點擊瞬間同步播放音效
            const sound = document.getElementById('openSound');
            sound.currentTime = 0;
            sound.play().catch(e => console.log("音效受限:", e));

            // 2. 開啟帷幕動畫
            document.getElementById('curtainContainer').classList.add('open');

            // 3. 2 秒後（音效放完）載入新的 Google Drive 雲端影片
            setTimeout(() => {
                const iframe = document.getElementById('videoIframe');
                iframe.src = "https://drive.google.com/file/d/1pZTyUgB34-nDn2ZTAyAy_ZwJxNkQac39/preview?autoplay=1";
            }, 2000);
        }
    </script>

</body>
</html>
