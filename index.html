<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ave Mujica - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', -apple-system, sans-serif;
            color: #e0e0e0;
        }

        /* 帷幕幕布 */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 9999;
            display: flex;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 1.8s;
        }

        .curtain {
            width: 50vw;
            height: 100dvh;
            background: linear-gradient(to bottom, #1a0005 0%, #4a0011 50%, #0a0003 100%);
            box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
            display: flex;
            align-items: center;
        }

        .curtain-left { border-right: 2px solid #ba55d3; justify-content: flex-end; }
        .curtain-right { border-left: 2px solid #ba55d3; justify-content: flex-start; }

        .curtain-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5f5f5;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ba55d3, 0 0 25px #8b0000;
            border: 1px solid rgba(186, 85, 211, 0.5);
            padding: 14px 24px;
            background: rgba(10, 0, 15, 0.85);
            border-radius: 6px;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.5s;
            white-space: nowrap;
        }

        .curtain-container.open .curtain-left { transform: translateX(-100%); }
        .curtain-container.open .curtain-right { transform: translateX(100%); }
        .curtain-container.open .curtain-text { opacity: 0; }
        .curtain-container.open { pointer-events: none; }

        /* 滿版影片區域 */
        .video-container {
            width: 100vw;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右上角帶文字清單按鈕 */
        .menu-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100001;
            background: rgba(15, 0, 20, 0.9);
            color: #ba55d3;
            border: 1px solid #ba55d3;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(186, 85, 211, 0.6);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .menu-toggle-btn:active {
            transform: scale(0.95);
        }

        /* 側邊欄選單 */
        .sidebar {
            position: fixed;
            top: 0;
            right: -270px;
            width: 250px;
            height: 100dvh;
            background: rgba(10, 0, 15, 0.95);
            border-left: 1px solid rgba(186, 85, 211, 0.5);
            z-index: 100000;
            padding: 90px 15px 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-title {
            font-size: 0.9rem;
            color: #ba55d3;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(186, 85, 211, 0.3);
            padding-bottom: 5px;
        }

        .video-btn {
            background: rgba(30, 0, 40, 0.8);
            color: #e0e0e0;
            border: 1px solid rgba(186, 85, 211, 0.4);
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .video-btn:hover, .video-btn.active-video {
            background: rgba(186, 85, 211, 0.35);
            border-color: #ba55d3;
            color: #fff;
            box-shadow: 0 0 12px rgba(186, 85, 211, 0.5);
        }
    </style>
</head>
<body>

    <!-- 音效元件 -->
    <audio id="openSound" preload="auto" playsinline>
        <source src="music2.mp3?v=9.0" type="audio/mpeg">
    </audio>

    <!-- 帷幕幕布 -->
    <div class="curtain-container" id="curtainContainer" onclick="startExperience()">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="curtain-text">歡迎來到 Ave Mujica 的世界</div>
    </div>

    <!-- 右上角顯示「☰ 影片清單」按鈕 -->
    <button class="menu-toggle-btn" id="menuBtn" onclick="toggleSidebar()">
        ☰ 影片清單
    </button>

    <!-- 右側側邊選單 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">影片播放清單</div>
        <button class="video-btn active-video" onclick="switchVideo('1pZTyUgB34-nDn2ZTAyAy_ZwJxNkQac39', this)">
            ▶ 影片一 (主要)
        </button>
        <button class="video-btn" onclick="switchVideo('1p5fnnJggNINcGow-6N9ryp5sZZiyl2RA', this)">
            ▶ 影片二 (備用雲端)
        </button>
    </div>

    <!-- Google Drive 影片區 -->
    <div class="video-container">
        <iframe 
            id="videoIframe"
            src="" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function startExperience() {
            // 1. 播放音效
            const sound = document.getElementById('openSound');
            sound.volume = 1.0;
            sound.currentTime = 0;
            sound.play().catch(e => console.log("音效受限:", e));

            // 2. 開啟帷幕動畫
            document.getElementById('curtainContainer').classList.add('open');

            // 3. 2 秒後載入第一個影片
            setTimeout(() => {
                const iframe = document.getElementById('videoIframe');
                iframe.src = "https://drive.google.com/file/d/1pZTyUgB34-nDn2ZTAyAy_ZwJxNkQac39/preview?autoplay=1";
            }, 2000);
        }

        // 開啟/關閉側邊欄
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // 切換影片
        function switchVideo(fileId, element) {
            const iframe = document.getElementById('videoIframe');
            iframe.src = `https://drive.google.com/file/d/${fileId}/preview?autoplay=1`;

            // 高亮選取的按鈕
            const buttons = document.querySelectorAll('.video-btn');
            buttons.forEach(btn => btn.classList.remove('active-video'));
            element.classList.add('active-video');

            // 收起側邊欄
            toggleSidebar();
        }
    </script>

</body>
</html>
